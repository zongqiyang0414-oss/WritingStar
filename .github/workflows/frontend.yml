name: Frontend checks and preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archived-preview:
    name: Archived deployed v0.9.1 reference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:preview
      - run: npm run test:preview
      - run: node scripts/build-preview.mjs
      - name: Save archived deployment reference
        uses: actions/upload-artifact@v6
        with:
          name: archived-preview-${{ github.sha }}
          path: dist/build/preview
          if-no-files-found: error
          retention-days: 14

  verify:
    name: Current v0.9.1 source checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run type-check
      - run: npm test
      - name: Build from source without archived preview files
        run: |
          rm -rf preview/dist
          npm run build:site
      - run: npm run build:mp-weixin
      - name: Save current H5 source build
        uses: actions/upload-artifact@v6
        with:
          name: h5-${{ github.sha }}
          path: dist/client
          if-no-files-found: error
          retention-days: 14
      - name: Save current WeChat source build
        uses: actions/upload-artifact@v6
        with:
          name: mp-weixin-${{ github.sha }}
          path: dist/build/mp-weixin
          if-no-files-found: error
          retention-days: 14

  pages-build:
    if: vars.ENABLE_PAGES_PREVIEW == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci --no-audit --no-fund
      - name: Build for Pages path
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build:h5 -- --base "$PAGES_BASE_PATH/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/build/h5

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
